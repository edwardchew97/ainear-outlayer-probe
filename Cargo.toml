[package]
name = "outlayer-probe"
version = "0.1.0"
edition = "2021"

# Not part of the contracts workspace.
[workspace]

[[bin]]
name = "outlayer-probe"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
